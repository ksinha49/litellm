# Logstash Pipeline Configuration for LiteLLM Bedrock Guardrails
# This pipeline extracts guardrail data from PostgreSQL and indexes it into Elasticsearch

input {
  jdbc {
    # Database connection settings
    jdbc_connection_string => "${POSTGRES_CONNECTION_STRING:jdbc:postgresql://localhost:5432/litellm}"
    jdbc_user => "${POSTGRES_USER:postgres}"
    jdbc_password => "${POSTGRES_PASSWORD}"
    jdbc_driver_library => "/usr/share/logstash/postgresql-driver/postgresql-42.6.0.jar"
    jdbc_driver_class => "org.postgresql.Driver"

    # Query to extract guardrail data
    statement => "
      SELECT
        request_id,
        \"startTime\" AS start_time,
        model,
        \"user\" AS request_user,
        api_base,

        -- Guardrail identification
        (metadata::jsonb -> 'guardrail_information' ->> 'guardrail_name') AS guardrail_name,
        (metadata::jsonb -> 'guardrail_information' ->> 'guardrail_mode') AS guardrail_mode,
        (metadata::jsonb -> 'guardrail_information' ->> 'guardrail_status') AS guardrail_status,

        -- Detection results
        (metadata::jsonb -> 'guardrail_information' ->> 'detected') AS detected,
        (metadata::jsonb -> 'guardrail_information' ->> 'action_reason') AS action_reason,

        -- Performance metrics
        (metadata::jsonb -> 'guardrail_information' ->> 'start_time') AS guardrail_start_time,
        (metadata::jsonb -> 'guardrail_information' ->> 'end_time') AS guardrail_end_time,
        (metadata::jsonb -> 'guardrail_information' ->> 'duration') AS guardrail_duration_seconds,

        -- Complex JSON fields (as text, will be parsed in filters)
        (metadata::jsonb -> 'guardrail_information' -> 'masked_entity_count')::text AS masked_entity_count_raw,
        (metadata::jsonb -> 'guardrail_information' -> 'assessment_details')::text AS assessment_details_raw,
        (metadata::jsonb -> 'guardrail_information' -> 'guardrail_coverage')::text AS guardrail_coverage_raw,
        (metadata::jsonb -> 'guardrail_information' -> 'guardrail_outputs')::text AS guardrail_outputs_raw,
        (metadata::jsonb -> 'guardrail_information' -> 'guardrail_usage')::text AS guardrail_usage_raw,
        (metadata::jsonb -> 'guardrail_information' -> 'guardrail_request')::text AS guardrail_request_raw,
        (metadata::jsonb -> 'guardrail_information' -> 'guardrail_response')::text AS guardrail_response_raw,
        (metadata::jsonb -> 'applied_guardrails')::text AS applied_guardrails_raw

      FROM \"LiteLLM_SpendLogs\"

      WHERE (metadata::jsonb ? 'guardrail_information')
        AND \"startTime\" > :sql_last_value

      ORDER BY \"startTime\" ASC
    "

    # Scheduling
    schedule => "*/5 * * * *"  # Run every 5 minutes

    # Tracking column for incremental updates
    use_column_value => true
    tracking_column => "start_time"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/.logstash_jdbc_last_run_guardrails"

    # Set document ID to prevent duplicates
    # We'll use request_id in the output section
  }
}

filter {
  # Convert timestamp to proper format
  date {
    match => ["start_time", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
    target => "@timestamp"
  }

  # Parse boolean detected field
  if [detected] {
    mutate {
      convert => { "detected" => "boolean" }
    }
  }

  # Parse float duration
  if [guardrail_duration_seconds] {
    mutate {
      convert => { "guardrail_duration_seconds" => "float" }
    }
  }

  # Parse float timestamps
  if [guardrail_start_time] {
    mutate {
      convert => { "guardrail_start_time" => "float" }
    }
    # Convert Unix timestamp to date
    date {
      match => ["guardrail_start_time", "UNIX"]
      target => "guardrail_start_datetime"
    }
  }

  if [guardrail_end_time] {
    mutate {
      convert => { "guardrail_end_time" => "float" }
    }
    # Convert Unix timestamp to date
    date {
      match => ["guardrail_end_time", "UNIX"]
      target => "guardrail_end_datetime"
    }
  }

  # Parse JSON fields (wrapped in conditionals to handle nulls)

  # 1. Parse masked_entity_count
  if [masked_entity_count_raw] and [masked_entity_count_raw] != "" and [masked_entity_count_raw] != "null" {
    json {
      source => "masked_entity_count_raw"
      target => "masked_entity_count"
      skip_on_invalid_json => true
    }

    # Calculate total masked entities
    ruby {
      code => "
        if event.get('masked_entity_count').is_a?(Hash)
          total = event.get('masked_entity_count').values.sum
          event.set('masked_entity_total', total)
        end
      "
    }
  }

  # 2. Parse assessment_details (most important - contains policy violations)
  if [assessment_details_raw] and [assessment_details_raw] != "" and [assessment_details_raw] != "null" {
    json {
      source => "assessment_details_raw"
      target => "assessment_details"
      skip_on_invalid_json => true
    }

    # Extract key policy violation information
    ruby {
      code => '
        details = event.get("assessment_details")

        if details.is_a?(Array) && details.length > 0
          assessment = details[0]

          # Extract topic policy violations
          if assessment["topicPolicy"] && assessment["topicPolicy"]["topics"]
            topics = assessment["topicPolicy"]["topics"]
            event.set("policy_violations_topic_count", topics.length)
            blocked_topics = topics.select { |t| t["action"] == "BLOCKED" }
            event.set("policy_violations_topic_blocked", blocked_topics.length)
          end

          # Extract content policy violations (HATE, INSULTS, SEXUAL, VIOLENCE, etc.)
          if assessment["contentPolicy"] && assessment["contentPolicy"]["filters"]
            filters = assessment["contentPolicy"]["filters"]
            event.set("policy_violations_content_count", filters.length)

            # Group by type
            content_types = filters.group_by { |f| f["type"] }
            content_types.each do |type, violations|
              event.set("policy_content_#{type.downcase}_count", violations.length)
            end
          end

          # Extract word policy violations
          if assessment["wordPolicy"]
            custom_words = assessment["wordPolicy"]["customWords"] || []
            managed_words = assessment["wordPolicy"]["managedWordLists"] || []
            event.set("policy_violations_word_count", custom_words.length + managed_words.length)
          end

          # Extract PII violations
          if assessment["sensitiveInformationPolicy"]
            pii_entities = assessment["sensitiveInformationPolicy"]["piiEntities"] || []
            regexes = assessment["sensitiveInformationPolicy"]["regexes"] || []
            event.set("policy_violations_pii_count", pii_entities.length + regexes.length)

            # Extract PII types
            pii_types = pii_entities.map { |p| p["type"] }.uniq
            event.set("pii_types_detected", pii_types)
          end

          # Extract contextual grounding policy
          if assessment["contextualGroundingPolicy"] && assessment["contextualGroundingPolicy"]["filters"]
            grounding_filters = assessment["contextualGroundingPolicy"]["filters"]
            event.set("policy_violations_grounding_count", grounding_filters.length)
          end
        end
      '
      tag_on_exception => "_rubyexception_assessment_parsing"
    }
  }

  # 3. Parse guardrail_coverage
  if [guardrail_coverage_raw] and [guardrail_coverage_raw] != "" and [guardrail_coverage_raw] != "null" {
    json {
      source => "guardrail_coverage_raw"
      target => "guardrail_coverage"
      skip_on_invalid_json => true
    }

    # Extract text and image coverage metrics
    ruby {
      code => "
        coverage = event.get('guardrail_coverage')

        if coverage.is_a?(Hash)
          if coverage['textCharacters']
            event.set('coverage_text_guarded', coverage['textCharacters']['guarded'])
            event.set('coverage_text_total', coverage['textCharacters']['total'])
          end

          if coverage['images']
            event.set('coverage_images_guarded', coverage['images']['guarded'])
            event.set('coverage_images_total', coverage['images']['total'])
          end
        end
      "
      tag_on_exception => "_rubyexception_coverage_parsing"
    }
  }

  # 4. Parse guardrail_outputs
  if [guardrail_outputs_raw] and [guardrail_outputs_raw] != "" and [guardrail_outputs_raw] != "null" {
    json {
      source => "guardrail_outputs_raw"
      target => "guardrail_outputs"
      skip_on_invalid_json => true
    }
  }

  # 5. Parse guardrail_usage (IMPORTANT for cost tracking)
  if [guardrail_usage_raw] and [guardrail_usage_raw] != "" and [guardrail_usage_raw] != "null" {
    json {
      source => "guardrail_usage_raw"
      target => "guardrail_usage"
      skip_on_invalid_json => true
    }

    # Calculate total policy units
    ruby {
      code => "
        usage = event.get('guardrail_usage')

        if usage.is_a?(Hash)
          # Extract individual policy units
          event.set('usage_content_policy_units', usage['contentPolicy']) if usage['contentPolicy']
          event.set('usage_word_policy_units', usage['wordPolicy']) if usage['wordPolicy']
          event.set('usage_sensitive_info_policy_units', usage['sensitiveInformationPolicy']) if usage['sensitiveInformationPolicy']
          event.set('usage_topic_policy_units', usage['topicPolicy']) if usage['topicPolicy']
          event.set('usage_grounding_policy_units', usage['contextualGroundingPolicy']) if usage['contextualGroundingPolicy']

          # Calculate total units
          total = usage.values.compact.sum
          event.set('usage_total_policy_units', total)
        end
      "
      tag_on_exception => "_rubyexception_usage_parsing"
    }
  }

  # 6. Parse guardrail_request (optional - can be large)
  if [guardrail_request_raw] and [guardrail_request_raw] != "" and [guardrail_request_raw] != "null" {
    json {
      source => "guardrail_request_raw"
      target => "guardrail_request"
      skip_on_invalid_json => true
    }
  }

  # 7. Parse guardrail_response (optional - can be large)
  if [guardrail_response_raw] and [guardrail_response_raw] != "" and [guardrail_response_raw] != "null" {
    json {
      source => "guardrail_response_raw"
      target => "guardrail_response"
      skip_on_invalid_json => true
    }
  }

  # 8. Parse applied_guardrails
  if [applied_guardrails_raw] and [applied_guardrails_raw] != "" and [applied_guardrails_raw] != "null" {
    json {
      source => "applied_guardrails_raw"
      target => "applied_guardrails"
      skip_on_invalid_json => true
    }
  }

  # Remove raw fields to save space
  mutate {
    remove_field => [
      "masked_entity_count_raw",
      "assessment_details_raw",
      "guardrail_coverage_raw",
      "guardrail_outputs_raw",
      "guardrail_usage_raw",
      "guardrail_request_raw",
      "guardrail_response_raw",
      "applied_guardrails_raw"
    ]
  }

  # Add metadata
  mutate {
    add_field => {
      "pipeline_version" => "1.0"
      "data_source" => "litellm_spend_logs"
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://localhost:9200}"]
    user => "${ELASTICSEARCH_USER:elastic}"
    password => "${ELASTICSEARCH_PASSWORD}"

    # Index naming with date rolling
    index => "litellm-guardrails-%{+YYYY.MM.dd}"

    # Use request_id as document ID to prevent duplicates
    document_id => "%{request_id}"

    # Template management
    template_name => "litellm-guardrails"
    template => "/usr/share/logstash/templates/litellm-guardrails-template.json"
    template_overwrite => true
  }

  # Optional: Output to stdout for debugging
  # stdout { codec => rubydebug }
}
