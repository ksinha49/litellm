# FINRA — Denied Financial Advice
# Prevents AI from providing personalized investment recommendations or guaranteeing returns
category_name: "finra_denied_financial_advice"
description: "Blocks AI from generating personalized investment recommendations, guaranteed return claims, insider trading tips, or advice that could constitute unauthorized financial advisory services"
default_action: "BLOCK"

identifier_words:
  - "invest"
  - "investment"
  - "portfolio"
  - "stock"
  - "bond"
  - "ETF"
  - "mutual fund"
  - "securities"
  - "401k"
  - "IRA"
  - "Roth IRA"
  - "brokerage"
  - "dividend"
  - "equity"
  - "asset allocation"
  - "retirement fund"
  - "annuity"
  - "hedge fund"
  - "derivatives"
  - "options trading"
  - "futures"
  - "margin"
  - "fiduciary"
  - "financial advisor"

additional_block_words:
  # Personalized recommendations
  - "you should buy"
  - "you should sell"
  - "I recommend buying"
  - "I recommend selling"
  - "you should invest in"
  - "put your money in"
  - "move your funds to"
  - "allocate your portfolio to"
  - "switch your holdings to"
  - "rebalance into"
  # Guaranteed returns
  - "guaranteed return"
  - "guaranteed profit"
  - "risk-free investment"
  - "can't lose money"
  - "sure thing"
  - "no-risk"
  - "zero risk"
  - "guaranteed to make"
  - "will definitely go up"
  - "certain to increase"
  # Insider knowledge
  - "hot tip"
  - "insider tip"
  - "insider information"
  - "insider trading"
  - "before it goes public"
  - "ahead of the announcement"
  - "non-public information"
  # Urgency/pressure tactics
  - "act now before"
  - "limited time opportunity"
  - "once in a lifetime"
  - "get in before it's too late"
  - "this stock is about to explode"

always_block_keywords:
  - keyword: "guaranteed 10% return"
    severity: "high"
  - keyword: "guaranteed annual return"
    severity: "high"
  - keyword: "insider trading tip"
    severity: "high"
  - keyword: "put your life savings in"
    severity: "high"
  - keyword: "risk-free guaranteed profit"
    severity: "high"
  - keyword: "I guarantee this stock will"
    severity: "high"
  - keyword: "buy this stock before the announcement"
    severity: "high"
  - keyword: "non-public material information"
    severity: "high"
  - keyword: "you will definitely make money"
    severity: "high"
  - keyword: "this is a sure thing invest now"
    severity: "high"

exceptions:
  - "not financial advice"
  - "consult a financial advisor"
  - "consult a licensed financial"
  - "past performance does not guarantee"
  - "past performance is not indicative"
  - "for educational purposes only"
  - "for informational purposes only"
  - "this is not a recommendation"
  - "speak with a qualified advisor"
  - "general market information"
  - "does not constitute investment advice"
  - "securities involve risk"
  - "you could lose money"
