# HIPAA — Denied Medical Advice
# Prevents AI from providing medical diagnoses, prescriptions, or clinical advice
category_name: "hipaa_denied_medical_advice"
description: "Blocks AI from generating medical diagnoses, prescription recommendations, dosage changes, or clinical treatment advice that could constitute unauthorized practice of medicine"
default_action: "BLOCK"

identifier_words:
  - "diagnose"
  - "diagnosis"
  - "prescribe"
  - "prescription"
  - "medication"
  - "dosage"
  - "treatment plan"
  - "symptoms"
  - "prognosis"
  - "clinical"
  - "patient"
  - "medical condition"
  - "side effects"
  - "contraindication"
  - "drug interaction"
  - "lab results"
  - "test results"
  - "blood work"
  - "radiology"
  - "pathology"
  - "surgical"
  - "therapy"
  - "referral"
  - "discharge"

additional_block_words:
  # Direct diagnosis
  - "I diagnose you"
  - "you have been diagnosed"
  - "your diagnosis is"
  - "based on your symptoms you have"
  - "you are suffering from"
  - "you likely have"
  # Prescription advice
  - "take this medication"
  - "I recommend you take"
  - "start taking"
  - "stop taking your medication"
  - "switch your medication to"
  - "increase your dosage"
  - "decrease your dosage"
  - "you should be on"
  # Treatment directives
  - "you need surgery"
  - "you should undergo"
  - "I recommend this treatment"
  - "your treatment plan should be"
  - "discontinue treatment"
  - "begin this therapy"
  # Lab interpretation
  - "your lab results indicate"
  - "your blood work shows you have"
  - "based on your test results"
  - "your scan reveals"
  - "your biopsy confirms"

always_block_keywords:
  - keyword: "I prescribe"
    severity: "high"
  - keyword: "your test results indicate you have"
    severity: "high"
  - keyword: "I am diagnosing you with"
    severity: "high"
  - keyword: "take 500mg of"
    severity: "high"
  - keyword: "increase your dose to"
    severity: "high"
  - keyword: "you should stop taking your prescribed"
    severity: "high"
  - keyword: "your lab results confirm you have"
    severity: "high"
  - keyword: "based on your MRI you have"
    severity: "high"
  - keyword: "I recommend surgery for"
    severity: "high"
  - keyword: "your pathology report confirms"
    severity: "high"

exceptions:
  - "consult your doctor"
  - "consult a healthcare professional"
  - "not medical advice"
  - "for informational purposes only"
  - "speak with your physician"
  - "contact your healthcare provider"
  - "this is not a diagnosis"
  - "seek professional medical help"
  - "general health information"
  - "educational purposes only"
  - "please consult a licensed"
